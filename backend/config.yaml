# config.yaml — satu file, semua threshold operasional

trigger_engine:
  window_minutes: 30
  mode: "OR"
  min_token_age_minutes: 2.0        # Koin baru 2-30 menit
  max_token_age_minutes: 30.0       # Batas maksimal 30 menit (TIDAK boleh lebih dari 30 menit)
  min_liquidity_usd: 3000.0        # Diturunkan ke 3000 USD agar pool pump.fun/DEX awal bisa masuk
  cooldown_seconds: 2700            # naik dari 1800 — kurangi risiko "kena umpan dua kali"

decision_gate:
  confidence_threshold: 0.50  # Diturunkan 0.75 → 0.50 agar model bootstrap bisa generate BUY signal
                               # Naikkan kembali ke 0.65-0.75 setelah ≥100 real trades terkumpul

risk:
  risk_pct_per_trade: 0.01 # Fixed 1% dari equity
  max_concurrent_positions: 5
  max_daily_loss_pct: 0.04          # Dikonfirmasi pemilik sistem: 4% harian (2026-07-31)
  max_weekly_loss_pct: 0.28         # Dikonfirmasi pemilik sistem: 28% mingguan (2026-07-31)
  max_total_exposure_usd: 2500.0
  initial_baseline_equity_usd: 100.0 # Initial baseline equity dari portofolio wallet
  circuit_breaker_reset_utc: "00:00"

trailing_tp:
  tiers:
    - {r_min: 0, r_max: 1, trail_pct: null}        # SL tetap -1R sampai 1R
    - {r_min: 1, r_max: 2, trail_pct: 0.45}         # DIUBAH — dulu null (tanpa proteksi), sekarang ada trailing + breakeven guard
    - {r_min: 2, r_max: 5, trail_pct: 0.25}
    - {r_min: 5, r_max: 10, trail_pct: 0.15}
    - {r_min: 10, r_max: null, trail_pct: 0.10}

labeling:
  buy_benar_threshold_r: 3.0
  salah_threshold_r: -1.0

retrain:
  schedule_utc: "02:00"
  min_closed_trades_first: 100
  min_closed_trades_alt: 50
  min_buy_benar_in_alt: 15
  rolling_window_days: 30
  rollback_accuracy_drop_pct: 0.05

model_bootstrap:
  history_days: 30
  min_trades_warning: 50
  max_signatures_per_wallet: 500
  api_timeout_seconds: 8.0

kill_switch:
  dev_wallet_sell_threshold_pct: 0.05 # % dari supply, contoh default 5%
  slippage_spike_threshold_pct: 0.10   # contoh default 10%

relevance_filter:
  min_swap_amount_usd: 5.0    # Dari 10 → 5 USD, agar event kecil tidak diblok
  min_lp_change_usd: 1000.0
  dex_routers:
    - "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8"  # Raydium AMM V4
    - "6EF8rrecMDMKMzBkv7jVLFv1E2syLQH5SH3iFh9FEAKB"  # pump.fun
    - "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc"   # Orca Whirlpool
    - "JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4"   # Jupiter V6
    - "9W959DqEETiGZocYWCQPaJ6sBmUzgfxXfqGeTEdp3aQP"  # Orca AMM V1
    - "srmqPvymJeFKQ4zGQed1GFppgkRHL9kaELCbyksJtPX"   # Serum DEX V3
  custodial_exchanges:
    - "BinanceCustodianAddress1111111111111111"
    - "CoinbaseCustodianAddress2222222222222222"

safety_check:
  max_top_10_holders_share: 0.50   # Dari 20% → 50% (realistis untuk meme token)
  require_lp_locked: false          # Dinonaktifkan — sebagian besar pool Solana tidak lock LP
  require_contract_verified: false  # Dinonaktifkan — Solana tidak ada konsep contract verified seperti ETH
  require_mint_authority_revoked: true  # Tetap aktif — ini penting
  max_deployer_holding_pct: 0.10   # Maksimal 10% kepemilikan dompet creator/deployer

discovery:
  occurrence_threshold: 3
  profit_verification_min_pct: 0.60
  trade_enabled: true

rpc:
  # Konfigurasi RPC URL ber-API Key HARUS diatur melalui .env (SOLANA_RPC_PRIMARY_URL & SOLANA_RPC_SECONDARY_URL)
  primary_url: "${SOLANA_RPC_PRIMARY_URL}"
  secondary_url: "${SOLANA_RPC_SECONDARY_URL}"
  fallback_url: "https://api.mainnet-beta.solana.com"
  max_retry: 5

# --- Transaction Fees -------------------------------------------------------
# Priority fee = tip ke validator Jito agar transaksi diproses lebih cepat.
# BUY: kompetitif | SELL: hemat | DUST: hampir gratis
transaction_fees:
  priority_fee_buy: 0.0001
  priority_fee_sell: 0.00005
  priority_fee_dust: 0.000005
  slippage_buy_pct: 5.0
  slippage_sell_pct: 10.0
  slippage_sell_emergency_pct: 25.0 

# --- Blacklist Settings ------------------------------------------------------
# Exclude specific token symbols and mint addresses from trading.
blacklist:
  keywords:
    - "PEPE"
    - "BONK"
    - "DOGE"
    - "FARTCOIN"
    - "FART"
    - "SHIB"
    - "FLOKI"
    - "WIF"
  mints:
    - "DezXAZ8z7PnrnRJjz3wXBoRgixrfNg7yFLBnRx4S75Jb" # BONK
    - "9b3j5dg64BDm18mC69o1zM45p1LsNz29o2FDN26Dpump" # Fartcoin